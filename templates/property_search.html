<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Search with Amenities - Real Estate AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .search-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 2rem;
            margin: 2rem 0;
        }
        
        .property-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .property-card:hover {
            transform: translateY(-5px);
        }
        
        .amenity-badge {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            margin: 0.25rem;
            font-size: 0.85rem;
            display: inline-block;
        }
        
        .score-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .score-excellent { background: #28a745; }
        .score-good { background: #ffc107; }
        .score-average { background: #fd7e14; }
        .score-poor { background: #dc3545; }
        
        .amenity-category {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .amenity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .amenity-item:last-child {
            border-bottom: none;
        }
        
        .rating-stars {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-home me-2"></i>Real Estate AI
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/predict">Predict Price</a>
                <a class="nav-link" href="/browse-properties">Browse Properties</a>
                <a class="nav-link active" href="/property-search">Search with Amenities</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Search Form -->
        <div class="search-container">
            <h2 class="text-center mb-4">
                <i class="fas fa-search text-primary me-2"></i>
                Property Search with Nearby Amenities
            </h2>
            
            <form id="searchForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" id="searchLocation" 
                           placeholder="Enter location (e.g., Whitefield)" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Property Type</label>
                    <select class="form-select" id="propertyType">
                        <option value="">All Types</option>
                        <option value="apartment">Apartment</option>
                        <option value="villa">Villa</option>
                        <option value="house">Independent House</option>
                        <option value="plot">Plot</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Min Price (₹L)</label>
                    <input type="number" class="form-control" id="minPrice" 
                           placeholder="0" min="0" max="1000">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Max Price (₹L)</label>
                    <input type="number" class="form-control" id="maxPrice" 
                           placeholder="1000" min="0" max="1000">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="text-center py-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Searching properties and analyzing amenities...</p>
        </div>

        <!-- Search Results -->
        <div id="searchResults" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 id="resultsTitle">Search Results</h3>
                <span id="resultsCount" class="badge bg-primary fs-6"></span>
            </div>
            
            <div id="propertiesList">
                <!-- Properties will be populated here -->
            </div>
        </div>

        <!-- No Results -->
        <div id="noResults" class="text-center py-5" style="display: none;">
            <i class="fas fa-search text-muted" style="font-size: 4rem;"></i>
            <h4 class="mt-3 text-muted">No Properties Found</h4>
            <p class="text-muted">Try adjusting your search criteria or explore different locations.</p>
            <a href="/list-property" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>List Your Property
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            searchProperties();
        });

        async function searchProperties() {
            const location = document.getElementById('searchLocation').value;
            const propertyType = document.getElementById('propertyType').value;
            const minPrice = document.getElementById('minPrice').value || 0;
            const maxPrice = document.getElementById('maxPrice').value || 1000;

            if (!location.trim()) {
                alert('Please enter a location to search');
                return;
            }

            // Show loading
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';

            try {
                // Search properties
                const searchParams = new URLSearchParams({
                    location: location,
                    type: propertyType,
                    min_price: minPrice,
                    max_price: maxPrice
                });

                const response = await fetch(`/api/search-properties?${searchParams}`);
                const data = await response.json();

                // Hide loading
                document.getElementById('loadingIndicator').style.display = 'none';

                if (data.success && data.properties.length > 0) {
                    displayResults(data.properties, data.search_params);
                } else {
                    document.getElementById('noResults').style.display = 'block';
                }

            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('loadingIndicator').style.display = 'none';
                alert('Error searching properties. Please try again.');
            }
        }

        function displayResults(properties, searchParams) {
            const resultsContainer = document.getElementById('searchResults');
            const propertiesList = document.getElementById('propertiesList');
            const resultsCount = document.getElementById('resultsCount');
            const resultsTitle = document.getElementById('resultsTitle');

            resultsTitle.textContent = `Properties in ${searchParams.location}`;
            resultsCount.textContent = `${properties.length} found`;

            propertiesList.innerHTML = properties.map(property => createPropertyCard(property)).join('');
            resultsContainer.style.display = 'block';
        }

        function createPropertyCard(property) {
            const amenities = property.nearby_amenities;
            const overallScore = amenities.overall_score;
            
            let scoreClass = 'score-poor';
            if (overallScore >= 80) scoreClass = 'score-excellent';
            else if (overallScore >= 60) scoreClass = 'score-good';
            else if (overallScore >= 40) scoreClass = 'score-average';

            return `
                <div class="property-card">
                    <div class="row g-0">
                        <div class="col-md-8">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <h5 class="card-title mb-1">${property.property_type} in ${property.location}</h5>
                                        <p class="text-muted mb-2">
                                            <i class="fas fa-home me-1"></i>${property.size} • 
                                            <i class="fas fa-expand-arrows-alt me-1"></i>${property.total_sqft} sqft • 
                                            <i class="fas fa-bath me-1"></i>${property.bath} bath
                                        </p>
                                    </div>
                                    <div class="text-end">
                                        <div class="h4 text-primary mb-0">₹${property.ai_predicted_price?.toFixed(1) || 'N/A'} L</div>
                                        <small class="text-muted">AI Predicted</small>
                                    </div>
                                </div>

                                <p class="card-text">${property.description || 'No description available'}</p>

                                <div class="row g-2 mb-3">
                                    ${amenities.highlights.map(highlight => 
                                        `<div class="col-auto"><span class="amenity-badge"><i class="fas fa-check text-success me-1"></i>${highlight}</span></div>`
                                    ).join('')}
                                </div>

                                <div class="d-flex gap-3">
                                    <button class="btn btn-primary" onclick="contactOwner('${property.id}')">
                                        <i class="fas fa-phone me-2"></i>Contact Owner
                                    </button>
                                    <button class="btn btn-outline-primary" onclick="viewAmenities('${property.location}')">
                                        <i class="fas fa-map-marker-alt me-2"></i>View All Amenities
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-4 bg-light h-100">
                                <div class="text-center mb-3">
                                    <div class="score-circle ${scoreClass} mx-auto">
                                        ${overallScore}
                                    </div>
                                    <small class="text-muted d-block mt-2">Location Score</small>
                                </div>

                                <div class="amenity-categories">
                                    ${Object.entries(amenities.category_scores).map(([category, score]) => `
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <span class="text-capitalize">${category}</span>
                                            <div class="progress" style="width: 60px; height: 8px;">
                                                <div class="progress-bar" style="width: ${score}%"></div>
                                            </div>
                                            <small class="text-muted">${score}</small>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function contactOwner(propertyId) {
            // Implement contact owner functionality
            alert(`Contact owner for property ${propertyId}`);
        }

        function viewAmenities(location) {
            // Open amenities modal or page
            window.open(`/amenities/${location}`, '_blank');
        }

        // Auto-search on page load if location is provided
        const urlParams = new URLSearchParams(window.location.search);
        const initialLocation = urlParams.get('location');
        if (initialLocation) {
            document.getElementById('searchLocation').value = initialLocation;
            searchProperties();
        }
    </script>
</body>
</html>
